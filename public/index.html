<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jagaan Pesakit</title>
<style>
:root{--c:#16a34a;--c2:#0d9488;--d:#15803d;--dd:#166534;--l:#f0fdf4;--l2:#dcfce7;--ink:#14532d;--mut:#5f8770;--line:#d5efe0;--sh:0 4px 20px rgba(22,101,52,.08);--sh2:0 8px 26px rgba(22,101,52,.14)}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#f3fbf6;
 background-image:radial-gradient(640px 320px at 8% -8%,rgba(34,197,94,.16),transparent 60%),radial-gradient(560px 280px at 102% 4%,rgba(13,148,136,.12),transparent 60%);
 background-attachment:fixed}
::selection{background:#bbf7d0;color:#14532d}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#9fe3bd;border-radius:99px;border:2px solid #f3fbf6}::-webkit-scrollbar-track{background:transparent}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#16a34a 0%,#0d9488 100%);color:#fff;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 4px 18px rgba(22,101,52,.25)}
h1{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.12)}
#who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#who .s{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.45);backdrop-filter:blur(4px);padding:6px 13px;font-size:.86rem;border-radius:999px}#who .s:hover{background:rgba(255,255,255,.28)}
main{max-width:780px;margin:auto;padding:18px 16px 70px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid rgba(22,163,74,.13);border-radius:18px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh);transition:box-shadow .25s}
.card:hover{box-shadow:var(--sh2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{animation:fadeUp .35s ease both}
h3{margin:0 0 12px;color:var(--dd);font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:6px;height:20px;border-radius:99px;background:linear-gradient(180deg,#22c55e,var(--c2));flex:none}
label{display:block;font-weight:650;margin:12px 0 4px;font-size:.9rem;color:#2f5c48}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fbfefc;color:var(--ink);transition:border-color .18s,box-shadow .18s}
input:hover,textarea:hover,select:hover{border-color:#a7d9c0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3.5px rgba(22,163,74,.16);background:#fff}
input:disabled{background:#eef8f2;color:#456b57;cursor:not-allowed;border-color:#dcefe4}
input[type=file]{padding:9px;border:2px dashed #a7d9c0;border-radius:12px;background:#f4fbf7;cursor:pointer}
input[type=file]::file-selector-button{font:inherit;font-weight:700;margin-right:10px;padding:6px 14px;border:0;border-radius:8px;background:var(--l2);color:var(--dd);cursor:pointer}
textarea{min-height:74px;resize:vertical}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:linear-gradient(135deg,#22c55e,var(--d));color:#fff;box-shadow:0 3px 10px rgba(22,163,74,.32);transition:transform .15s,box-shadow .15s,filter .15s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(22,163,74,.4);filter:brightness(1.04)}
button:active{transform:translateY(0)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
button.s{background:#fff;color:var(--d);border:2px solid #b7e2c8;box-shadow:0 1px 4px rgba(22,101,52,.08)}
button.s:hover{background:var(--l);border-color:var(--c)}
button.d{background:linear-gradient(135deg,#f87171,#dc2626);box-shadow:0 3px 10px rgba(220,38,38,.28)}
button.d:hover{box-shadow:0 6px 16px rgba(220,38,38,.38);filter:brightness(1.05)}
nav{display:flex;gap:8px;margin:4px 0 16px;flex-wrap:wrap}
nav button{background:#fff;color:var(--d);border:2px solid transparent;box-shadow:0 1px 6px rgba(22,101,52,.1);border-radius:999px;padding:8px 16px;font-size:.92rem}
nav button:hover{background:var(--l);border-color:#b7e2c8}
nav button.on{background:linear-gradient(135deg,#22c55e,var(--d));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(22,163,74,.35)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#dc2626;font-weight:700}.ok{color:var(--d);font-weight:700}
table{width:100%;border-collapse:collapse}
th{padding:10px 8px;text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#3d7358;border-bottom:2px solid #d9efe3}
td{padding:11px 8px;border-bottom:1px solid #e7f5ed;vertical-align:middle}
tr:hover td{background:#f2fbf6}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.th img{height:76px;border-radius:12px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.tm{display:flex;gap:8px;margin:6px 0}.tm input{width:auto;padding:8px 10px;border-radius:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.g3 b{font-size:1.7rem;display:block;line-height:1.1}
.g3 button{font:inherit;cursor:pointer;background:linear-gradient(180deg,#fff,#f6fdf9);color:var(--ink);border:2px solid #d9efe3;border-radius:16px;padding:12px 8px;box-shadow:0 1px 4px rgba(22,101,52,.06);transition:.18s}
.g3 button:hover{border-color:var(--c);transform:translateY(-3px);box-shadow:0 8px 18px rgba(22,101,52,.14)}
.g3 button.on{border-color:var(--c);background:linear-gradient(180deg,var(--l),var(--l2));box-shadow:inset 0 0 0 1px rgba(22,163,74,.2)}
#iq{margin-top:12px}
.it{border:1.5px solid #d9efe3;border-radius:16px;padding:14px 16px;margin:10px 0;background:linear-gradient(180deg,#fff,#fbfefc);transition:box-shadow .2s,transform .2s,border-color .2s;animation:fadeUp .3s ease both}
.it:hover{box-shadow:0 6px 18px rgba(22,101,52,.1);transform:translateY(-1px)}
.it.low{border-color:#fcd9a4;background:linear-gradient(180deg,#fffdf6,#fff8eb)}
.it.out{border-color:#f5c2c0;background:linear-gradient(180deg,#fffbfb,#fff2f1)}
.pb{height:10px;background:#e5f6ec;border-radius:99px;overflow:hidden;margin:8px 0}
.pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4ade80,var(--c))}
.low .pb i{background:linear-gradient(90deg,#fbbf24,#d97706)}.out .pb i{background:linear-gradient(90deg,#f87171,#dc2626)}
.bg{font-size:.76rem;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:3px 12px;background:var(--l2);color:var(--dd)}
.low .bg{background:#fef3c7;color:#b45309}.out .bg{background:#fee2e2;color:#b91c1c}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{width:92px;text-align:center}.row button{padding:7px 14px;border-radius:10px}
small{color:var(--mut)}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button.fchip,span.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--l);border:1.5px solid #b7e2c8;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:650;color:var(--dd);box-shadow:none;animation:fadeUp .25s ease both}
button.fchip:hover{background:var(--l2);border-color:var(--c);transform:none;filter:none;box-shadow:0 2px 8px rgba(22,101,52,.16)}
.fchip i{cursor:pointer;font-style:normal;font-weight:800;color:#dc2626;font-size:1rem;line-height:1;padding:0 2px}
.fchip i:hover{color:#b91c1c}
.fchip.rm{opacity:.55}.fchip.rm i{color:var(--d)}
p[style]{color:var(--mut)}
.login{max-width:400px;margin:52px auto;text-align:center;animation:fadeUp .4s ease both}
.login h3{justify-content:center}.login h3::before{display:none}
.login label{text-align:left}
.login button{width:100%;padding:12px;margin-top:8px}
.logo{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,#22c55e,#0d9488);display:grid;place-items:center;font-size:2rem;box-shadow:0 10px 24px rgba(22,163,74,.38)}
@media(max-width:520px){.g2{grid-template-columns:1fr}h1{font-size:1.05rem}main{padding:10px 10px 60px}.card{padding:14px 14px;border-radius:16px}nav button{padding:7px 13px;font-size:.86rem}}

// ---- Appointments (admin edits, users view only)
let APPT=[];const fmtD=s=>{if(!s)return"";const d=new Date(s);return isNaN(d)?esc(s):d.toLocaleString(lang==="en"?"en-MY":"ms-MY",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})};
async function appt(){$("#c").innerHTML=`<div class="card"><h3>${t("apptTitle")}</h3>${adm()?`<div class="g2">${fld("at",t("apptTitleLabel"),"text",t("apptTitlePh"))}${fld("ad",t("apptDateLabel"),"datetime-local")}</div><p id="ae"></p><button onclick="addA()">${t("add")}</button>`:`<p style="color:#555">${t("apptViewOnly")}</p>`}</div><div class="card"><h3>${t("apptList")}</h3><div id="al">${t("loading")}</div></div>`;al()}
async function al(){APPT=await api("/appointments");$("#al").innerHTML=APPT.length?APPT.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(apptHtml).join(""):t("noAppts")}
const apptHtml=a=>`<div class="it"><div class="row" style="justify-content:space-between"><b>${esc(a.title)}</b><span>${adm()?`<button class="s" onclick="editA(${a.id})">${t("edit")}</button> <button class="d" onclick="delA(${a.id})">${t("delete")}</button>`:""}</span></div><div>🗓️ ${fmtD(a.date)}</div><small style="color:#666">${t("updatedAppt")} ${esc(a.ts)} ${t("by")} ${esc(a.byName)}</small></div>`;
async function addA(){try{await api("/appointments","POST",{title:$("#at").value,date:$("#ad").value});$("#at").value="";$("#ad").value="";$("#ae").innerHTML="";al()}catch(e){$("#ae").innerHTML=`<span class="err">${esc(e.message)}</span>`}}
async function editA(id){const a=APPT.find(x=>x.id===id),n=prompt(t("apptTitlePrompt"),a.title);if(n===null)return;const d=prompt(t("apptDatePrompt"),a.date);if(d===null)return;try{await api("/appointments/"+id,"PUT",{title:n,date:d});al()}catch(e){alert(e.message)}}
async function delA(id){if(confirm(t("deleteApptQ"))){await api("/appointments/"+id,"DELETE");al()}}
// ---- Medical Records (admin edits, users view only)
let RECS=[],PEND=[],REM=[],editRid=null,editFiles=[];
const CATK={lab:"catLab",imaging:"catImaging",rx:"catRx",doctor:"catDoctor",other:"catOther"};
const rsr=f=>new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/i.width,1400/i.height),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82))};i.src=URL.createObjectURL(f)});
async function rec(){PEND=[];REM=[];editRid=null;editFiles=[];
 $("#c").innerHTML=(adm()?recForm():"")+`<p style="color:var(--mut)${adm()?";display:none":""}">${t("recViewOnly")}</p><div class="card"><h3>${t("recList")}</h3><div id="rl">${t("loading")}</div></div>`;rl()}
function recForm(){return `<div class="card"><h3 id="rhdr">${t("recAdd")}</h3>
 <label>${t("recTitleLbl")}</label><input id="rt" placeholder="${t("recTitlePh")}">
 <div class="g2"><div><label>${t("recCat")}</label><select id="rc">${[["lab","catLab"],["imaging","catImaging"],["rx","catRx"],["doctor","catDoctor"],["other","catOther"]].map(([v,k])=>`<option value="${v}">${t(k)}</option>`).join("")}</select></div>
 <div><label>${t("recDate")}</label><input id="rd" type="date"></div></div>
 <label>${t("recNotes")}</label><textarea id="rn"></textarea>
 <label>${t("recFiles")}</label><input id="rf" type="file" multiple accept="image/*,application/pdf" onchange="rPick(this)">
 <div class="fchips" id="rfl"></div><p id="rm"></p>
 <button id="rbtn" onclick="rSave()">${t("add")}</button> <button class="s" id="rcancel" style="display:none" onclick="rCancelEdit()">${t("cancel")}</button></div>`}
async function rPick(el){const rm=$("#rm");rm.textContent="";
 for(const f of el.files){if(f.size>12e6){rm.innerHTML=`<span class="err">${t("fileTooBig")} (${esc(f.name)})</span>`;continue}
  if(f.type==="application/pdf"){PEND.push({name:f.name,mime:"application/pdf",data:await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(f)})})}
  else if(/^image\//.test(f.type))PEND.push({name:f.name.replace(/\.\w+$/,".jpg"),mime:"image/jpeg",data:await rsr(f)});
  else rm.innerHTML=`<span class="err">${t("badType")} (${esc(f.name)})</span>`}
 el.value="";rFl()}
function rFl(){const el=$("#rfl");if(!el)return;const ico=m=>m==="application/pdf"?"📄":"🖼️";
 el.innerHTML=editFiles.filter(f=>!REM.includes(f.id)).map(f=>`<span class="fchip">${ico(f.mime)} ${esc(f.name)} <i onclick="rDelExisting('${f.id}')" title="${t("delete")}">×</i></span>`).join("")
 +REM.map(fid=>{const f=editFiles.find(x=>x.id===fid);return f?`<span class="fchip rm">${ico(f.mime)} ${esc(f.name)} <i onclick="rUnDel('${fid}')" title="${t("undo")}">↺</i></span>`:""}).join("")
 +PEND.map((f,i)=>`<span class="fchip">${ico(f.mime)} ${esc(f.name)} <i onclick="rDelPend(${i})" title="${t("delete")}">×</i></span>`).join("")}
function rDelPend(i){PEND.splice(i,1);rFl()}
function rDelExisting(fid){if(!REM.includes(fid))REM.push(fid);rFl()}
function rUnDel(fid){REM=REM.filter(x=>x!==fid);rFl()}
async function rSave(){const rm=$("#rm"),ti=$("#rt").value.trim();if(!ti){rm.innerHTML=`<span class="err">${t("recTitleLbl")} ${lang==="en"?"required":"diperlukan"}</span>`;return}
 const d={title:ti,cat:$("#rc").value,date:$("#rd").value,notes:$("#rn").value,files:PEND.map(f=>({name:f.name,mime:f.mime,data:f.data}))};rm.textContent="";
 try{if(editRid!=null)await api("/records/"+editRid,"PUT",{...d,removeFiles:REM});else await api("/records","POST",d);rCancelEdit();rl()}catch(e){rm.innerHTML=`<span class="err">${esc(e.message)}</span>`}}
function rCancelEdit(){editRid=null;editFiles=[];PEND=[];REM=[];["rt","rd","rn"].forEach(i=>{const e=$("#"+i);if(e)e.value=""});
 const h=$("#rhdr"),bt=$("#rbtn"),cx=$("#rcancel"),s=$("#rc");if(h)h.textContent=t("recAdd");if(bt)bt.textContent=t("add");if(cx)cx.style.display="none";if(s)s.value="other";rFl()}
async function rl(){RECS=await api("/records");$("#rl").innerHTML=RECS.length?RECS.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||b.id-a.id).map(recHtml).join(""):t("noRecs")}
const recHtml=r=>`<div class="it"><div class="row" style="justify-content:space-between"><b>${esc(r.title)}</b><span class="bg">${t(CATK[r.cat]||"catOther")}</span></div>
 <div class="row">📅 ${r.date?esc(r.date):"-"}${adm()?`<span style="margin-left:auto;display:flex;gap:6px"><button class="s" onclick="editR(${r.id})">${t("edit")}</button><button class="d" onclick="delR(${r.id})">${t("delete")}</button></span>`:""}</div>
 ${r.notes?`<p style="margin:6px 0 0;color:#456b57;white-space:pre-wrap">${esc(r.notes)}</p>`:""}
 <div class="fchips">${(r.files||[]).map(f=>`<button type="button" class="fchip" onclick="openF(${r.id},'${f.id}')">${f.mime==="application/pdf"?"📄":"🖼️"} ${esc(f.name)}${adm()?` <i onclick="event.stopPropagation();delF(${r.id},'${f.id}')" title="${t("delete")}">×</i>`:""}</button>`).join("")}</div>
 <small>${t("updatedAppt")} ${esc(r.ts)} ${t("by")} ${esc(r.byName)}</small></div>`;
async function editR(id){const r=RECS.find(x=>x.id===id);if(!r||!$("#rt"))return;editRid=id;editFiles=(r.files||[]).slice();PEND=[];REM=[];
 $("#rt").value=r.title;$("#rc").value=CATK[r.cat]?r.cat:"other";$("#rd").value=r.date||"";$("#rn").value=r.notes||"";
 $("#rhdr").textContent=t("recEdit");$("#rbtn").textContent=t("save");$("#rcancel").style.display="";rFl();$("#rt").focus()}
async function delR(id){if(confirm(t("delRecQ"))){await api("/records/"+id,"DELETE");if(editRid===id)rCancelEdit();rl()}}
async function delF(rid,fid){if(confirm(t("delFileQ"))){await api("/records/"+rid+"/files/"+fid,"DELETE");if(editRid===rid){editFiles=editFiles.filter(x=>x.id!==fid);REM=REM.filter(x=>x!==fid);rFl()}rl()}}
async function openF(rid,fid){try{const res=await fetch("/api/records/"+rid+"/files/"+fid,{headers:{Authorization:"Bearer "+tok,"X-Lang":lang}});
 if(!res.ok)throw new Error(lang==="en"?"File not found":"Fail tiada");const u=URL.createObjectURL(await res.blob());window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),12e4)}catch(e){alert(e.message)}}
// ---- Users (super admin: own caregivers only)
let USRS=[];
async function usr(){$("#c").innerHTML=`<div class="card"><h3>${t("addUserTitle")}</h3><p style="color:#555">${t("usersHint")}</p>
  <div class="g2">${fld("nu",t("userUsername"),"text",t("userUsernamePh"))}${fld("np",t("userPassword"),"password")}</div>
  <div class="g2">${fld("nn",t("fullName"))}${fld("ne",t("userEmail"),"email","nama@email.com")}</div>
  <p id="um"></p><button onclick="addU()">${t("addUserBtn")}</button></div>
  <div class="card"><h3>${t("userList")}</h3><div id="ul">${t("loading")}</div></div>`;ul()}
async function ul(){USRS=await api("/users");
 $("#ul").innerHTML=USRS.length?`<table><tr><th>${t("username")}</th><th>${t("fullName")}</th><th>${t("email")}</th><th>${t("status")}</th><th></th></tr>${USRS.map((x,i)=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(x.email||"-")}</td><td>${x.role==="admin"?`<span class="bg">${t("roleAdmin")}</span>`:x.status==="active"?`<span class="ok">${t("statusActive")}</span>`:`<span class="err">${t("statusPending")}</span>`}</td><td>${x.role==="admin"?"":`${x.status!=="active"?`<button class="s" onclick="resendU(${i})">${t("resend")}</button> `:""}<button class="s" onclick="resetU(${i})">${t("resetPwd")}</button> <button class="d" onclick="delU(${i})">${t("delete")}</button>`}</td></tr>`).join("")}</table>`:`<p>${t("noUsers")}</p>`}
async function addU(){try{await api("/users","POST",{username:$("#nu").value.trim(),password:$("#np").value,name:$("#nn").value,email:$("#ne").value});
 $("#um").innerHTML=`<span class="ok">${t("userCreated")}</span>`;
 ["nu","np","nn","ne"].forEach(id=>$("#"+id).value="");ul()}catch(e){$("#um").innerHTML=`<span class="err">${esc(e.message)}</span>`}}
async function resendU(i){const x=USRS[i];if(!x)return;try{const r=await api("/users/"+encodeURIComponent(x.username)+"/resend","POST",{});alert(r.code?t("setupCodeLabel").replace("{c}",r.code):t("setupSent"));ul()}catch(e){alert(e.message)}}
async function resetU(i){const x=USRS[i];if(!x)return;
 if(!x.email){const np=prompt(t("newPwdPrompt").replace("{n}",x.name||x.username));if(np===null)return;try{await api("/users/"+encodeURIComponent(x.username)+"/reset","POST",{password:np});alert(t("pwdResetDone"));ul()}catch(e){alert(e.message)}return}
 if(!confirm(t("resetPwdQ").replace("{n}",x.email||x.username)))return;try{const r=await api("/users/"+encodeURIComponent(x.username)+"/reset","POST",{});alert(r.code?t("setupCodeLabel").replace("{c}",r.code):t("resetSent"));ul()}catch(e){alert(e.message)}}
async function delU(i){const x=USRS[i];if(!x)return;if(confirm(t("deleteUserQ").replace("{n}",x.email||x.username))){await api("/users/"+encodeURIComponent(x.username),"DELETE");ul()}}
// ---- Master admin (super admin accounts only)
let MUSERS=[];
async function master(){$("#c").innerHTML=`<div class="card"><h3>${t("masterTitle")}</h3><p style="color:#555">${t("masterHint")}</p></div>
 <div class="card"><h3>${t("masterAddTitle")}</h3>
 <div class="g2">${fld("mnu",t("userUsername"),"text",t("userUsernamePh"))}${fld("mnp",t("userPassword"),"password")}</div>
 <div class="g2">${fld("mnn",t("fullName"))}${fld("mne",t("userEmail"),"email","nama@email.com")}</div>
 <p id="mm"></p><button onclick="addM()">${t("addUserBtn")}</button></div>
 <div class="card"><h3>${t("masterList")}</h3><div id="ml">${t("loading")}</div></div>`;ml()}
async function ml(){MUSERS=await api("/master/users");
 $("#ml").innerHTML=MUSERS.length?`<table><tr><th>${t("username")}</th><th>${t("fullName")}</th><th>${t("email")}</th><th>${t("caregiversLabel")}</th><th>${t("status")}</th><th></th></tr>${MUSERS.map((x,i)=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(x.email||"-")}</td><td>${x.caregivers}</td><td>${x.status==="active"?`<span class="ok">${t("statusActive")}</span>`:`<span class="err">${t("statusPending")}</span>`}</td><td><button class="s" onclick="resetM(${i})">${t("resetPwd")}</button> <button class="d" onclick="delM(${i})">${t("delete")}</button></td></tr>`).join("")}</table>`:`<p>${t("masterNoAdmins")}</p>`}
async function addM(){try{await api("/master/users","POST",{username:$("#mnu").value.trim(),password:$("#mnp").value,name:$("#mnn").value,email:$("#mne").value});
 $("#mm").innerHTML=`<span class="ok">${t("userCreated")}</span>`;["mnu","mnp","mnn","mne"].forEach(id=>$("#"+id).value="");ml()}catch(e){$("#mm").innerHTML=`<span class="err">${esc(e.message)}</span>`}}
async function resetM(i){const x=MUSERS[i];if(!x)return;const np=prompt(t("masterResetQ").replace("{n}",x.username));
 if(np===null)return;if(np.trim().length<6){alert(t("passwordMin"));return}
 try{await api("/master/users/"+encodeURIComponent(x.username)+"/reset","POST",{password:np.trim()});alert(t("masterResetDone"));ml()}catch(e){alert(e.message)}}
async function delM(i){const x=MUSERS[i];if(!x)return;if(!confirm(t("masterDeleteQ").replace("{n}",x.username)))return;
 try{await api("/master/users/"+encodeURIComponent(x.username),"DELETE");ml()}catch(e){alert(e.message)}}
init();
</script></body></html>
