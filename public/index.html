<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jagaan Pesakit</title>
<style>
:root{--c:#0f766e;--l:#e6f7f5;--ink:#10302d}*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,sans-serif;background:#f4faf9;color:var(--ink)}
header{background:var(--c);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:1.25rem}main{max-width:760px;margin:auto;padding:12px 14px 60px}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 6px #0001}
h3{margin:0 0 8px;color:var(--c)}label{display:block;font-weight:600;margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;padding:9px;border:2px solid #b7d8d4;border-radius:10px}
textarea{min-height:70px}button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--c);color:#fff}
button.s{background:#fff;color:var(--c);border:2px solid var(--c)}button.d{background:#c0392b}
nav{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}nav button{background:#fff;color:var(--c);border:2px solid var(--c)}nav button.on{background:var(--c);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.g2{grid-template-columns:1fr}}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch label{margin:0;font-weight:600;border:2px solid #b7d8d4;border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.ch input{width:auto}.ch label:has(input:checked){background:var(--l);border-color:var(--c)}
.err{color:#c0392b;font-weight:700}.ok{color:var(--c);font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:left}
.th{display:flex;gap:6px;flex-wrap:wrap}.th img{height:70px;border-radius:8px}.tm{display:flex;gap:6px;margin:4px 0}.tm input{width:auto}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g3 b{font-size:1.6rem;display:block}.g3 button{font:inherit;cursor:pointer;background:#fff;color:inherit;border:2px solid #d3e8e5;border-radius:12px;padding:8px;transition:.15s}.g3 button:hover{border-color:var(--c);transform:translateY(-2px)}.g3 button.on{border-color:var(--c);background:var(--l)}#iq{margin-top:10px}.it{transition:.15s}.it{border:2px solid #d3e8e5;border-radius:12px;padding:10px 12px;margin:8px 0}.it.low{border-color:#e67e22;background:#fff7ee}.it.out{border-color:#c0392b;background:#fff0ef}.pb{height:10px;background:#e0eceb;border-radius:6px;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:var(--c)}.low .pb i{background:#e67e22}.out .pb i{background:#c0392b}.bg{font-size:.8rem;border-radius:999px;padding:2px 10px;color:#fff;background:var(--c)}.low .bg{background:#e67e22}.out .bg{background:#c0392b}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row input{width:90px;text-align:center}.row button{padding:6px 14px}
</style></head><body>
<header><h1 id="title">🏥 Jagaan Pesakit</h1><div id="who"></div></header><main id="v"></main>
<script>
const $=s=>document.querySelector(s),V=$("#v");let me=null,tab="form",tok="";try{tok=localStorage.getItem("tk")||""}catch{}
const TX={
 ms:{appTitle:"🏥 Jagaan Pesakit",logout:"Keluar",tabForm:"📝 Borang",tabInventory:"📦 Inventori",tabHistory:"📂 Sejarah",tabUsers:"👥 Pengguna",tabPatient:"🧑🦽 Pesakit",patientTitle:"Nama Pesakit (Super Admin)",patientHint:"Nama ini diisi automatik dalam borang untuk semua pengguna.",save:"Simpan",patientSaved:"Nama pesakit disimpan ✅",alertTitle:"Bacaan tidak normal",alertTempHigh:"Suhu tinggi",alertTempLow:"Suhu rendah",alertSpo2Low:"Oksigen rendah",alertBpHigh:"Tekanan darah tinggi",alertBpLow:"Tekanan darah rendah",alertHrHigh:"Kadar jantung tinggi",alertHrLow:"Kadar jantung rendah",alertSugarHigh:"Gula tinggi",alertSugarLow:"Gula rendah",alertConfirm:"Bacaan tidak normal dikesan. Hantar laporan juga?",normalVitals:"Bacaan dalam julat normal ✅",
  loginTitle:"Log Masuk",username:"Username",password:"Kata laluan",loginBtn:"Log masuk",
  info:"Maklumat",patientName:"Nama pesakit",caretaker:"Nama penjaga",shiftInfo:"Maklumat Syif",shiftStart:"Mula syif",shiftEnd:"Tamat syif",
  condition:"Keadaan Pesakit",temp:"Suhu (°C)",spo2:"SpO2 / Oksigen (%)",bp:"Tekanan darah",hr:"Kadar jantung (bpm)",sugar:"Gula (mmol/L)",cough:"Batuk",no:"Tiada",yes:"Ada",others:"Lain-lain",
  tasks:"Tugas Penjaga",milk:"Bagi susu (masa)",pampers:"Tukar pampers (masa)",bedsoreQ:"Ada kesan bedsore?",attach:"Ambil gambar",
  meds:"Bagi ubat (masa)",right:"Mengiring ke kanan (masa)",left:"Mengiring ke kiri (masa)",other:"Lain-lain",handover:"Nota Serah Tugas",addTime:"+ Masa",
  submit:"Hantar laporan",submitting:"Menghantar…",saved:"✅ Laporan disimpan",wa:"📲 Hantar ke WhatsApp",viewPrint:"Lihat / Cetak laporan",newForm:"Borang baharu",
  historyTitle:"Sejarah laporan",loading:"Memuatkan…",date:"Tarikh",patientCol:"Pesakit",caretakerCol:"Penjaga",open:"Buka",noReports:"Tiada laporan lagi.",
  invTitle:"📦 Dashboard Inventori",totalItems:"Jumlah item",lowStock:"Stok rendah",outStock:"Habis",addItemAdmin:"Tambah item (super admin)",
  itemName:"Nama item",unit:"Unit",itemNamePh:"cth: Pampers",unitPh:"cth: pek / tin / biji",initialStock:"Stok awal",minStock:"Stok minimum (amaran)",add:"Tambah",
  stockOnly:"Anda boleh kemas kini bilangan stok sahaja.",invList:"Senarai inventori",out:"Habis",low:"Rendah",enough:"Cukup",minLabel:"min",edit:"Edit",delete:"Padam",
  updated:"Kemas kini:",by:"oleh",noItems:"Tiada item lagi.",askAdmin:" Minta super admin tambah item.",itemNamePrompt:"Nama item",unitPrompt:"Unit",
  minPrompt:"Stok minimum (amaran)",deleteItemQ:"Padam item ini?",
  createUser:"Cipta pengguna (caregiver)",fullName:"Nama penuh",passwordMin:"Kata laluan (min 6)",create:"Cipta",userList:"Senarai pengguna",userCreated:"Pengguna dicipta ✅",deleteUserQ:"Padam {n}?",searchItem:"🔍 Cari item…",noMatch:"Tiada item sepadan.",allItems:"Semua"},
 en:{appTitle:"🏥 Patient Care",logout:"Logout",tabForm:"📝 Form",tabInventory:"📦 Inventory",tabHistory:"📂 History",tabUsers:"👥 Users",tabPatient:"🧑🦽 Patient",patientTitle:"Patient Name (Super Admin)",patientHint:"This name is auto-filled in the form for all users.",save:"Save",patientSaved:"Patient name saved ✅",alertTitle:"Abnormal readings",alertTempHigh:"High temperature",alertTempLow:"Low temperature",alertSpo2Low:"Low oxygen",alertBpHigh:"High blood pressure",alertBpLow:"Low blood pressure",alertHrHigh:"High heart rate",alertHrLow:"Low heart rate",alertSugarHigh:"High sugar",alertSugarLow:"Low sugar",alertConfirm:"Abnormal reading detected. Submit the report anyway?",normalVitals:"Readings within normal range ✅",
  loginTitle:"Sign In",username:"Username",password:"Password",loginBtn:"Sign in",
  info:"Information",patientName:"Patient name",caretaker:"Caretaker name",shiftInfo:"Shift Information",shiftStart:"Shift start",shiftEnd:"Shift end",
  condition:"Patient Condition",temp:"Temperature (°C)",spo2:"SpO2 / Oxygen (%)",bp:"Blood pressure",hr:"Heart rate (bpm)",sugar:"Sugar (mmol/L)",cough:"Cough",no:"No",yes:"Yes",others:"Others",
  tasks:"Carer Tasks",milk:"Milk feeding (time)",pampers:"Change pampers (time)",bedsoreQ:"Any bedsore noticed?",attach:"Snap picture",
  meds:"Give medicine (time)",right:"Turn to right (time)",left:"Turn to left (time)",other:"Other",handover:"Handover Notes",addTime:"+ Time",
  submit:"Submit report",submitting:"Submitting…",saved:"✅ Report saved",wa:"📲 Send to WhatsApp",viewPrint:"View / Print report",newForm:"New form",
  historyTitle:"Report history",loading:"Loading…",date:"Date",patientCol:"Patient",caretakerCol:"Caretaker",open:"Open",noReports:"No reports yet.",
  invTitle:"📦 Inventory Dashboard",totalItems:"Total items",lowStock:"Low stock",outStock:"Out of stock",addItemAdmin:"Add item (super admin)",
  itemName:"Item name",unit:"Unit",itemNamePh:"e.g. Pampers",unitPh:"e.g. pack / tin / pcs",initialStock:"Initial stock",minStock:"Minimum stock (alert)",add:"Add",
  stockOnly:"You can only update stock quantities.",invList:"Inventory list",out:"Out",low:"Low",enough:"Enough",minLabel:"min",edit:"Edit",delete:"Delete",
  updated:"Updated:",by:"by",noItems:"No items yet.",askAdmin:" Ask a super admin to add items.",itemNamePrompt:"Item name",unitPrompt:"Unit",
  minPrompt:"Minimum stock (alert)",deleteItemQ:"Delete this item?",
  createUser:"Create user (caregiver)",fullName:"Full name",passwordMin:"Password (min 6)",create:"Create",userList:"User list",userCreated:"User created ✅",deleteUserQ:"Delete {n}?",searchItem:"🔍 Search items…",noMatch:"No matching items.",allItems:"All"}
};
let lang="ms";try{lang=localStorage.getItem("lang")==="en"?"en":"ms"}catch{}
const t=k=>(TX[lang]&&TX[lang][k])||TX.ms[k]||k;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chrome(){document.documentElement.lang=lang;document.title=t("appTitle");$("#title").textContent=t("appTitle");$("#who").innerHTML=(me?esc(me.name)+" ":"")+`<button class="s" onclick="toggleLang()">🌐 ${lang==="ms"?"EN":"BM"}</button>`+(me?` <button class="s" onclick="logout()">${t("logout")}</button>`:"")}
function snap(){if(!$("#patient"))return null;const s={raw:{},times:{},photos:PH.slice(),bs:$("#bs").value};
 ["patient","ss","se","temp","spo2","bp","hr","sugar","cough","others","bs","ot","ho"].forEach(id=>{const e=$("#"+id);if(e)s.raw[id]=e.value});
 ["milk","pampers","meds","right","left"].forEach(id=>{const c=$("#"+id);if(c)s.times[id]=[...c.querySelectorAll("input")].map(x=>x.value)});return s}
function restore(s){if(!s||!$("#patient"))return;
 ["patient","ss","se","temp","spo2","bp","hr","sugar","cough","others","bs","ot","ho"].forEach(id=>{const e=$("#"+id);if(e&&s.raw[id]!==undefined)e.value=s.raw[id]});
 ["milk","pampers","meds","right","left"].forEach(id=>{const c=$("#"+id);if(!c||!s.times[id])return;c.innerHTML="";s.times[id].forEach(v=>c.insertAdjacentHTML("beforeend",`<div class="tm"><input type="time" value="${esc(v)}"></div>`))});
 PH=s.photos||[];const th=$("#th");if(th)th.innerHTML=PH.map(p=>`<img src="${p}">`).join("");$("#bsx").style.display=s.bs==="yes"?"block":"none"}
function toggleLang(){const s=snap();lang=lang==="ms"?"en":"ms";try{localStorage.setItem("lang",lang)}catch{}if(me){app().then(()=>restore(s))}else{chrome();login()}}
async function api(p,m="GET",b){const r=await fetch("/api"+p,{method:m,headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok,"X-Lang":lang},body:b?JSON.stringify(b):undefined});
  const x=await r.text();if(r.status===401&&me){logout();throw new Error(lang==="en"?"Session ended":"Sesi tamat")}if(!r.ok)throw new Error((()=>{try{return JSON.parse(x).error}catch{return x}})());return r.headers.get("content-type").includes("json")?JSON.parse(x):x}
function logout(){tok="";me=null;try{localStorage.removeItem("tk")}catch{}init()}
async function init(){chrome();if(tok){try{me=await api("/me")}catch{me=null}}me?app():login()}
function login(e=""){V.innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h3>${t("loginTitle")}</h3><label>${t("username")}</label><input id="u" autocomplete="username"><label>${t("password")}</label><input id="p" type="password" autocomplete="current-password"><p class="err">${esc(e)}</p><button id="b" style="width:100%">${t("loginBtn")}</button></div>`;
  $("#p").onkeydown=e=>{if(e.key==="Enter")$("#b").click()};
  $("#b").onclick=async()=>{try{const r=await api("/login","POST",{username:$("#u").value.trim().toLowerCase(),password:$("#p").value});tok=r.token;try{localStorage.setItem("tk",tok)}catch{}me=r.user;app()}catch(x){login(x.message)}}}
function app(){chrome();
  return (async()=>{try{PATIENT=(await api("/patient")).name||""}catch{}
  const T=[["form",t("tabForm")],["inv",t("tabInventory")],["hist",t("tabHistory")],...(me.role==="admin"?[["usr",t("tabUsers")],["pat",t("tabPatient")]]:[])];
  V.innerHTML=`<nav>${T.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="tab='${k}';app()">${l}</button>`).join("")}</nav><div id="c"></div>`;({form,hist,usr,inv,pat})[tab]()})()}
// ---- Form
let PH=[],WA="",PATIENT="";
const fld=(id,l,ty="text",ph="")=>`<div><label>${l}</label><input id="${id}" type="${ty}" placeholder="${ph}"></div>`;
function form(){PH=[];$("#c").innerHTML=`<div class="card"><h3>${t("info")}</h3><label>${t("patientName")}</label><input id="patient" value="${esc(PATIENT)}" disabled><label>${t("caretaker")}</label><input value="${esc(me.name)}" disabled></div>
<div class="card"><h3>${t("shiftInfo")}</h3><div class="g2">${fld("ss",t("shiftStart"),"datetime-local")}${fld("se",t("shiftEnd"),"datetime-local")}</div></div>
<div class="card"><h3>${t("condition")}</h3><div class="g2">${fld("temp",t("temp"),"text","37.0")}${fld("spo2",t("spo2"),"text","98")}${fld("bp",t("bp"),"text","120/80")}${fld("hr",t("hr"),"text","75")}${fld("sugar",t("sugar"),"text","6.5")}<div><label>${t("cough")}</label><select id="cough"><option value="no">${t("no")}</option><option value="yes">${t("yes")}</option></select></div></div><div id="vwarn" style="margin-top:8px"></div><label>${t("others")}</label><textarea id="others"></textarea></div>
<div class="card"><h3>${t("tasks")}</h3>${tl("milk",t("milk"))}${tl("pampers",t("pampers"))}
<label>${t("bedsoreQ")}</label><select id="bs" onchange="$('#bsx').style.display=this.value==='yes'?'block':'none'"><option value="no">${t("no")}</option><option value="yes">${t("yes")}</option></select>
<div id="bsx" style="display:none"><label>${t("attach")}</label><input type="file" accept="image/*" capture="environment" multiple onchange="pics(this)"><div class="th" id="th"></div></div>
${tl("meds",t("meds"))}${tl("right",t("right"))}${tl("left",t("left"))}<label>${t("other")}</label><textarea id="ot"></textarea></div>
<div class="card"><h3>${t("handover")}</h3><textarea id="ho"></textarea></div><p id="msg"></p><button id="sub" style="width:100%;padding:13px">${t("submit")}</button>`;
  ["milk","pampers","meds","right","left"].forEach(i=>tm(i));$("#sub").onclick=submit;
  ["temp","spo2","bp","hr","sugar"].forEach(id=>{const e=$("#"+id);if(e)e.addEventListener("input",checkVitals)});checkVitals()}
// ---- Patient (super admin)
async function pat(){PATIENT=(await api("/patient")).name||"";$("#c").innerHTML=`<div class="card"><h3>${t("patientTitle")}</h3><label>${t("patientName")}</label><input id="pn" value="${esc(PATIENT)}"><p style="color:#555">${t("patientHint")}</p><p id="pm"></p><button onclick="savePatient()">${t("save")}</button></div>`}
async function savePatient(){const v=$("#pn").value.trim();try{const r=await api("/patient","PUT",{name:v});PATIENT=r.name;$("#pn").value=PATIENT;$("#pm").innerHTML=`<span class="ok">${t("patientSaved")}</span>`}catch(e){$("#pm").innerHTML=`<span class="err">${esc(e.message)}</span>`}}
const tl=(id,l)=>`<label>${l}</label><div id="${id}"></div><button class="s" onclick="tm('${id}')">${t("addTime")}</button>`;
function tm(id){$("#"+id).insertAdjacentHTML("beforeend",`<div class="tm"><input type="time"></div>`)}
const times=id=>[...document.querySelectorAll(`#${id} input`)].map(x=>x.value).filter(Boolean);
const numv=x=>{const n=parseFloat(String(x??"").replace(",","."));return isNaN(n)?null:n};
function vitalAlerts(){const a=[],v=id=>{const e=$("#"+id);return e?e.value:""},push=(id,m,x)=>a.push({id,msg:m+" ("+x+")"});
  const temp=numv(v("temp"));if(temp!=null){if(temp>37.5)push("temp",t("alertTempHigh"),v("temp")+"°C");else if(temp<35)push("temp",t("alertTempLow"),v("temp")+"°C")}
  const spo2=numv(v("spo2"));if(spo2!=null&&spo2<95)push("spo2",t("alertSpo2Low"),v("spo2")+"%");
  const m=String(v("bp")).match(/(\d+)\s*\/\s*(\d+)/);if(m){const s=+m[1],x=+m[2];if(s>=140||x>=90)push("bp",t("alertBpHigh"),v("bp"));else if(s<90||x<60)push("bp",t("alertBpLow"),v("bp"))}
  const hr=numv(v("hr"));if(hr!=null){if(hr>100)push("hr",t("alertHrHigh"),v("hr"));else if(hr<60)push("hr",t("alertHrLow"),v("hr"))}
  const su=numv(v("sugar"));if(su!=null){if(su>7.8)push("sugar",t("alertSugarHigh"),v("sugar"));else if(su<3.9)push("sugar",t("alertSugarLow"),v("sugar"))}
  return a}
function checkVitals(){if(!$("#vwarn"))return;const ids=["temp","spo2","bp","hr","sugar"],any=ids.some(id=>{const e=$("#"+id);return e&&e.value.trim()});
  const a=vitalAlerts(),el=$("#vwarn");ids.forEach(id=>{const e=$("#"+id);if(e)e.style.borderColor=a.some(x=>x.id===id)?"#c0392b":""});
  if(!any){el.innerHTML="";return}
  el.innerHTML=a.length?`<div class="err">⚠️ ${t("alertTitle")}</div><ul style="margin:4px 0 0;padding-left:20px;color:#c0392b">${a.map(x=>`<li>${esc(x.msg)}</li>`).join("")}</ul>`:`<span class="ok">${t("normalVitals")}</span>`}
function rs(f){return new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/i.width,600/i.height),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.85))};i.src=URL.createObjectURL(f)})}
async function pics(el){for(const f of el.files)PH.push(await rs(f));$("#th").innerHTML=PH.map(p=>`<img src="${p}">`).join("")}
async function submit(){const v=id=>$("#"+id).value.trim(),b=$("#sub");const fmt=s=>s?s.replace("T"," "):"";
  const d={patient:v("patient"),shiftStart:fmt(v("ss")),shiftEnd:fmt(v("se")),temp:v("temp"),spo2:v("spo2"),bp:v("bp"),hr:v("hr"),sugar:v("sugar"),cough:v("cough"),others:v("others"),milk:times("milk"),pampers:times("pampers"),meds:times("meds"),bedsore:v("bs"),photos:v("bs")==="yes"?PH:[],right:times("right"),left:times("left"),otherTasks:v("ot"),handover:v("ho")};
  const al=vitalAlerts();if(al.length&&!confirm(t("alertConfirm")+"\n\n"+al.map(x=>"• "+x.msg).join("\n")))return;
  b.disabled=true;b.textContent=t("submitting");$("#msg").textContent="";
  try{const r=await api("/reports","POST",d);$("#c").innerHTML=`<div class="card"><h3>${t("saved")}</h3>${(r.alerts||[]).length?`<div class="err" style="margin:6px 0">⚠️ ${t("alertTitle")}<ul style="margin:4px 0 0;padding-left:20px">${r.alerts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}<p>Email: ${esc(r.sent.email)}<br>Telegram: ${esc(r.sent.telegram)}</p><button onclick="window.open('https://wa.me/?text='+encodeURIComponent(WA))">${t("wa")}</button> <button class="s" onclick="view(${r.id})">${t("viewPrint")}</button> <button class="s" onclick="tab='form';app()">${t("newForm")}</button></div>`;WA=r.text}
  catch(e){$("#msg").innerHTML=`<span class="err">${esc(e.message)}</span>`;b.disabled=false;b.textContent=t("submit")}}
async function view(id){const w=window.open("");try{w.document.write(await api("/reports/"+id))}catch(e){w.close();alert(e.message)}}
// ---- History
async function hist(){$("#c").innerHTML=`<div class="card"><h3>${t("historyTitle")}</h3><div id="hl">${t("loading")}</div></div>`;
  const r=await api("/reports");$("#hl").innerHTML=r.length?`<table><tr><th>${t("date")}</th><th>${t("patientCol")}</th><th>${t("caretakerCol")}</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.ts)}</td><td>${esc(x.patient)}</td><td>${esc(x.byName)}</td><td><button class="s" onclick="view(${x.id})">${t("open")}</button></td></tr>`).join("")}</table>`:t("noReports")}
// ---- Inventory
let INV=[],invFilter="all",invQ="";const adm=()=>me.role==="admin";
async function inv(){$("#c").innerHTML=`<div class="card"><h3>${t("invTitle")}</h3><div class="g3" id="ist"></div><input id="iq" placeholder="${t("searchItem")}" value="${esc(invQ)}" oninput="invQ=this.value;invList()"></div>${adm()?`<div class="card"><h3>${t("addItemAdmin")}</h3><div class="g2">${fld("in",t("itemName"),"text",t("itemNamePh"))}${fld("iu",t("unit"),"text",t("unitPh"))}${fld("i0",t("initialStock"),"number")}${fld("im",t("minStock"),"number")}</div><p id="ie"></p><button onclick="addI()">${t("add")}</button></div>`:`<p style="color:#555">${t("stockOnly")}</p>`}<div class="card"><h3>${t("invList")}</h3><div id="il">${t("loading")}</div></div>`;il()}
const st=i=>i.stock===0?"out":i.stock<=i.min?"low":"";
async function il(){INV=await api("/inventory");invStats();invList()}
function invStats(){const low=INV.filter(i=>st(i)==="low").length,out=INV.filter(i=>st(i)==="out").length;
 $("#ist").innerHTML=[["all",INV.length,t("allItems"),""],["low",low,t("lowStock"),"#e67e22"],["out",out,t("outStock"),"#c0392b"]].map(([k,n,l,c])=>`<button class="${invFilter===k?"on":""}"${c?` style="color:${c}"`:""} onclick="setF('${k}')"><b>${n}</b>${l}</button>`).join("")}
function setF(k){invFilter=k;invStats();invList()}
function invList(){const q=invQ.toLowerCase();const list=INV.filter(i=>(invFilter==="all"||st(i)===invFilter)&&(!q||i.name.toLowerCase().includes(q)));
 $("#il").innerHTML=list.length?list.map(itemHtml).join(""):INV.length?t("noMatch"):t("noItems")+(adm()?"":t("askAdmin"))}
const itemHtml=i=>`<div class="it ${st(i)}"><div class="row" style="justify-content:space-between"><b>${esc(i.name)}</b><span class="bg">${{out:t("out"),low:t("low")}[st(i)]||t("enough")}</span></div>
  <div class="pb"><i style="width:${Math.min(100,i.stock/Math.max(i.min*3,i.stock,1)*100)}%"></i></div>
  <div class="row"><button class="s" onclick="setI(${i.id},${i.stock-1})">−</button><input type="number" min="0" value="${i.stock}" onchange="setI(${i.id},this.value)"><button class="s" onclick="setI(${i.id},${i.stock+1})">+</button><span>${esc(i.unit)} (${t("minLabel")} ${i.min})</span>
  ${adm()?`<button class="s" onclick="editI(${i.id})">${t("edit")}</button><button class="d" onclick="delI(${i.id})">${t("delete")}</button>`:""}</div><small style="color:#666">${t("updated")} ${esc(i.ts)} ${t("by")} ${esc(i.by)}</small></div>`;
async function setI(id,v){try{await api("/inventory/"+id,"PUT",{stock:Math.max(0,+v||0)});il()}catch(e){alert(e.message)}}
async function addI(){try{await api("/inventory","POST",{name:$("#in").value,unit:$("#iu").value,stock:$("#i0").value,min:$("#im").value});["in","iu","i0","im"].forEach(i=>$("#"+i).value="");$("#ie").innerHTML="";il()}catch(e){$("#ie").innerHTML=`<span class="err">${esc(e.message)}</span>`}}
async function editI(id){const i=INV.find(x=>x.id===id),n=prompt(t("itemNamePrompt"),i.name);if(n===null)return;const u=prompt(t("unitPrompt"),i.unit);if(u===null)return;const m=prompt(t("minPrompt"),i.min);if(m===null)return;try{await api("/inventory/"+id,"PUT",{name:n,unit:u,min:m});il()}catch(e){alert(e.message)}}
async function delI(id){if(confirm(t("deleteItemQ"))){await api("/inventory/"+id,"DELETE");il()}}
// ---- Users (super admin)
async function usr(){$("#c").innerHTML=`<div class="card"><h3>${t("createUser")}</h3>${fld("nu",t("username"))}${fld("nn",t("fullName"))}${fld("np",t("passwordMin"),"password")}<p id="um"></p><button onclick="addU()">${t("create")}</button></div><div class="card"><h3>${t("userList")}</h3><div id="ul"></div></div>`;ul()}
async function ul(){const r=await api("/users");$("#ul").innerHTML=`<table>${r.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${x.role}</td><td>${x.username===me.username?"":`<button class="d" onclick="delU('${esc(x.username)}')">${t("delete")}</button>`}</td></tr>`).join("")}</table>`}
async function addU(){try{await api("/users","POST",{username:$("#nu").value,name:$("#nn").value,password:$("#np").value});$("#um").innerHTML=`<span class="ok">${t("userCreated")}</span>`;["nu","nn","np"].forEach(i=>$("#"+i).value="");ul()}catch(e){$("#um").innerHTML=`<span class="err">${esc(e.message)}</span>`}}
async function delU(n){if(confirm(t("deleteUserQ").replace("{n}",n))){await api("/users/"+encodeURIComponent(n),"DELETE");ul()}}
init();
</script></body></html>
